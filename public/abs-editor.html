<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>abstraction editor</title>
  <link rel="stylesheet" href="theme.css">
  <!-- Set the theme before first paint; theme.js takes over from here. -->
  <script>
    (() => {
      let t = null;
      try { t = localStorage.getItem("tambourin.theme"); } catch { /* no storage */ }
      if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg); color: var(--fg);
      font-family: "IBM Plex Mono", "Fira Mono", "Courier New", monospace;
      height: 100dvh; overflow: hidden;
      -webkit-user-select: none; user-select: none;
    }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; cursor: default; }
    #tooltip {
      position: fixed; background: var(--tooltip-bg); color: var(--tooltip-fg);
      font-family: "IBM Plex Mono", "Fira Mono", "Courier New", monospace;
      font-size: 11px; padding: 6px 8px; max-width: 280px; line-height: 1.4;
      pointer-events: none; display: none; z-index: 20;
    }
    #tooltip .tt-name { color: var(--tooltip-name); }
    #tooltip .tt-type { color: var(--tooltip-type); }
    #box-input {
      position: fixed; background: transparent; border: none; outline: none;
      color: var(--fg); font-family: "IBM Plex Mono", "Fira Mono", "Courier New", monospace;
      font-size: 12px; padding: 0; display: none; z-index: 10;
      box-sizing: border-box;
    }
    #header-panel {
      position: fixed; top: 28px; right: 8px; width: 340px; max-height: calc(100% - 36px);
      overflow-y: auto; z-index: 15; padding: 8px 10px;
      background: var(--bg); color: var(--fg);
      border: 1px solid var(--popup-border); border-radius: 4px;
      font-size: 11px; -webkit-user-select: text; user-select: text;
    }
    #header-panel.hidden { display: none; }
    #header-panel .hp-label { color: var(--hint); display: inline-block; width: 78px; }
    #header-panel .hp-row { display: flex; align-items: center; gap: 4px; margin-bottom: 6px; }
    #header-panel .hp-head { color: var(--title-fg); margin: 10px 0 4px; display: flex; justify-content: space-between; }
    #header-panel input, #header-panel select, #header-panel textarea, #header-panel button {
      font: inherit; color: var(--fg); background: var(--bg);
      border: 1px solid var(--popup-border); border-radius: 2px; padding: 1px 3px;
    }
    #header-panel textarea { width: 100%; resize: vertical; }
    #header-panel button { cursor: pointer; }
    #header-panel button:hover { color: var(--control-hover); }
    #header-panel .hp-entry { display: grid; grid-template-columns: 22px 1fr 82px 18px; gap: 3px; margin-bottom: 3px; }
    #header-panel .hp-entry .hp-desc { grid-column: 2 / 4; }
    #header-panel .hp-idx { color: var(--hint); align-self: center; }
    #header-panel .hp-foot { margin-top: 10px; color: var(--hint); }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <input id="box-input" type="text" autocomplete="off" spellcheck="false">
  <div id="tooltip"></div>
  <div id="header-panel">
    <div class="hp-row"><span class="hp-label">name</span><span id="hp-name"></span></div>
    <div class="hp-row"><span class="hp-label">side</span>
      <select id="hp-side"><option value="">(choose)</option><option value="ctrl">ctrl</option><option value="synth">synth</option></select></div>
    <div><span class="hp-label">description</span></div>
    <textarea id="hp-desc" rows="3"></textarea>
    <div class="hp-list" data-list="args"></div>
    <div class="hp-list" data-list="inlets"></div>
    <div class="hp-list" data-list="outlets"></div>
    <div class="hp-foot"><button id="hp-sync" type="button">inlets/outlets from boxes</button></div>
    <div class="hp-foot">i hides this panel</div>
  </div>
  <script type="module" src="abs-editor.js"></script>
</body>
</html>
