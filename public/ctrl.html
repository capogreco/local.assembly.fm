<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ctrl — local.tamb.fm</title>
  <link rel="stylesheet" href="theme.css">
  <!-- Set the theme before first paint; theme.js takes over from here. -->
  <script>
    (() => {
      let t = null;
      try { t = localStorage.getItem("tambourin.theme"); } catch { /* no storage */ }
      if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg); color: var(--fg);
      font-family: "IBM Plex Mono", "Fira Mono", "Courier New", monospace;
      height: 100dvh; overflow: hidden;
      -webkit-user-select: none; user-select: none;
    }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; cursor: default; }
    #tooltip {
      position: fixed; background: var(--tooltip-bg); color: var(--tooltip-fg);
      font-family: "IBM Plex Mono", "Fira Mono", "Courier New", monospace;
      font-size: 11px; padding: 6px 8px; max-width: 280px; line-height: 1.4;
      pointer-events: none; display: none; z-index: 20;
    }
    #tooltip .tt-name { color: var(--tooltip-name); }
    #tooltip .tt-type { color: var(--tooltip-type); }
    #hint {
      position: fixed; left: 50%; top: 40%; transform: translateX(-50%);
      color: var(--hint); font-family: "IBM Plex Mono", "Fira Mono", "Courier New", monospace;
      font-size: 14px; display: none; pointer-events: none; z-index: 5;
    }
    #notice {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
      background: var(--notice-bg); color: var(--notice-fg); border: 1px solid var(--notice-border);
      font-family: "IBM Plex Mono", "Fira Mono", "Courier New", monospace;
      font-size: 12px; padding: 8px 12px; max-width: 80vw; line-height: 1.5;
      white-space: pre-wrap; display: none; z-index: 30; cursor: pointer;
    }
    #box-input {
      position: fixed; background: transparent; border: none; outline: none;
      color: var(--fg); font-family: "IBM Plex Mono", "Fira Mono", "Courier New", monospace;
      font-size: 12px; padding: 0; display: none; z-index: 10;
      box-sizing: border-box;
    }
    /* Help popup */
    #help-popup {
      position: fixed;
      top: 50px; right: 50px;
      width: 600px; height: 450px;
      background: var(--bg);
      border: 1px solid var(--popup-border);
      border-radius: 4px;
      box-shadow: 0 4px 20px var(--popup-shadow);
      z-index: 1000;
      display: flex;
      flex-direction: column;
    }
    #help-popup.hidden { display: none; }
    .help-titlebar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: var(--titlebar-bg);
      border-bottom: 1px solid var(--titlebar-border);
      cursor: move;
      user-select: none;
    }
    .help-title { color: var(--title-fg); font-size: 13px; }
    .help-close {
      background: none;
      border: none;
      color: var(--close-fg);
      font-size: 18px;
      cursor: pointer;
      padding: 0 4px;
    }
    .help-close:hover { color: var(--close-hover); }
    #theme-toggle {
      position: fixed; top: 8px; left: 120px; z-index: 15;
      width: 10px; height: 10px; padding: 0;
      color: var(--control-fg); border: 1px solid currentColor; border-radius: 50%;
      background: linear-gradient(90deg, currentColor 50%, transparent 50%);
      cursor: pointer;
    }
    #theme-toggle:hover { color: var(--control-hover); }
    #help-canvas {
      flex: 1;
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <input id="box-input" type="text" autocomplete="off" spellcheck="false">
  <div id="tooltip"></div>
  <button id="theme-toggle" type="button" tabindex="-1" aria-label="toggle theme"></button>
  <div id="hint">press h for help</div>
  <div id="notice" title="click to dismiss"></div>
  <script type="module" src="ctrl.js"></script>
</body>
</html>
